name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      # Documentation gates first: they are cheap and independent of the built
      # artifact, so a stale index or a dead cross-reference fails in seconds.
      - run: npm run gates
      - run: npm test
